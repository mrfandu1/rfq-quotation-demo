name: Verify native n8n demonstration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 127.0.0.1
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_RUNNERS_MODE: internal
      N8N_DEFAULT_BINARY_DATA_MODE: default
      N8N_LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pull pinned n8n runtime
        run: |
          docker pull docker.n8n.io/n8nio/n8n:2.38.7
          docker image inspect --format '{{index .RepoDigests 0}}' docker.n8n.io/n8nio/n8n:2.38.7 > "$RUNNER_TEMP/n8n-image.txt"
      - name: Execute fixture through native nodes
        shell: bash
        run: |
          set -euo pipefail
          node test-matching.mjs
          RFQ_NATIVE_OUTPUT="$RUNNER_TEMP/rfq-native"
          mkdir -p "$RFQ_NATIVE_OUTPUT"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --env N8N_LISTEN_ADDRESS --env N8N_RUNNERS_BROKER_LISTEN_ADDRESS \
            --env N8N_DIAGNOSTICS_ENABLED --env N8N_VERSION_NOTIFICATIONS_ENABLED \
            --env N8N_TEMPLATES_ENABLED --env N8N_RUNNERS_MODE \
            --env N8N_DEFAULT_BINARY_DATA_MODE --env N8N_LOG_LEVEL \
            --env N8N_USER_FOLDER=/output/user \
            --volume "$GITHUB_WORKSPACE:/work:ro" --volume "$RFQ_NATIVE_OUTPUT:/output" \
            --workdir /work --entrypoint /bin/sh "$(cat "$RUNNER_TEMP/n8n-image.txt")" /work/native-run.sh
          python3 verify-native.py "$RFQ_NATIVE_OUTPUT/native-execution.log" \
            --n8n-version "$(cat "$RFQ_NATIVE_OUTPUT/n8n-version.txt")" \
            --node-version "$(cat "$RFQ_NATIVE_OUTPUT/node-version.txt")"
          python3 verify-native.py "$RFQ_NATIVE_OUTPUT/native-execution-aed.log" --case aed-rounding \
            --n8n-version "$(cat "$RFQ_NATIVE_OUTPUT/n8n-version.txt")" \
            --node-version "$(cat "$RFQ_NATIVE_OUTPUT/node-version.txt")"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-demo
          path: |
            quotation-native-n8n.xlsx
            native-execution-evidence.json
            quotation-native-aed.xlsx
            native-aed-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Show execution error if verification fails
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/rfq-native/native-execution.log" ]; then
            tail -c 16000 "$RUNNER_TEMP/rfq-native/native-execution.log"
          fi
